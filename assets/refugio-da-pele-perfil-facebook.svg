<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background warm gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" style="stop-color:#FDF6EC"/>
      <stop offset="100%" style="stop-color:#EFE2CC"/>
    </radialGradient>

    <!-- Drop gradient (gold → terracotta) -->
    <linearGradient id="dropGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A96A"/>
      <stop offset="100%" style="stop-color:#C4683E"/>
    </linearGradient>

    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8AAE8E"/>
      <stop offset="100%" style="stop-color:#5A7A5E"/>
    </linearGradient>

    <!-- Subtle inner ring glow -->
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" style="stop-color:#C4683E;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#C4683E;stop-opacity:0.06"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#C4683E" flood-opacity="0.18"/>
    </filter>

    <!-- Leaf shadow -->
    <filter id="leafShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3a5a3e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle texture rings (decorative, centered) -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#C4683E" stroke-width="1" opacity="0.10"/>
  <circle cx="400" cy="400" r="310" fill="none" stroke="#C4683E" stroke-width="0.5" opacity="0.07"/>
  <circle cx="400" cy="400" r="370" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.08"/>

  <!-- Inner glow overlay -->
  <circle cx="400" cy="400" r="380" fill="url(#ringGlow)"/>

  <!-- ── SYMBOL GROUP (scaled up, centered at 400,400) ── -->
  <!-- Original symbol was ~120×120 centered at 60,60 in logo space -->
  <!-- Scale factor ~5x, translate to center at 400,400 -->
  <g transform="translate(400,390) scale(5.2)">

    <!-- Outer decorative rings around the drop -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#C4683E" stroke-width="0.5" opacity="0.20"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#C4683E" stroke-width="0.3" opacity="0.12"/>

    <!-- Left leaf -->
    <path d="M -14 -14 Q -28 0 -14 16 Q -6 8 -6 -2 Z"
          fill="url(#leafGrad)" opacity="0.85" filter="url(#leafShadow)"/>

    <!-- Right leaf -->
    <path d="M 14 -14 Q 28 0 14 16 Q 6 8 6 -2 Z"
          fill="url(#leafGrad)" opacity="0.65" filter="url(#leafShadow)"/>

    <!-- Main water drop -->
    <path d="M 0 -42 C 0 -42, -18 -16, -18 -2 C -18 9.5 -10 18 0 18 C 10 18 18 9.5 18 -2 C 18 -16, 0 -42, 0 -42 Z"
          fill="url(#dropGrad)" opacity="0.95" filter="url(#dropShadow)"/>

    <!-- Highlight on drop -->
    <path d="M 0 -34 C 0 -34, -7 -18, -7 -4 C -7 -2.5 -6.7 -1 -6.2 0.2 C -5.2 -5 -2 -14 0 -22 C 2 -14 5.2 -5 6.2 0.2 C 6.7 -1 7 -2.5 7 -4 C 7 -18 0 -34 0 -34 Z"
          fill="white" opacity="0.22"/>

    <!-- Decorative gold dots -->
    <circle cx="-18" cy="-22" r="2.2" fill="#C9A96E" opacity="0.55"/>
    <circle cx="18" cy="-22" r="2.2" fill="#C9A96E" opacity="0.55"/>
  </g>

  <!-- ── BRAND TEXT ── -->
  <!-- "Refúgio" -->
  <text
    x="400" y="626"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="68"
    font-weight="400"
    letter-spacing="6"
    text-anchor="middle"
    fill="#2C2118">Ref&#250;gio</text>

  <!-- Decorative line under Refúgio -->
  <line x1="200" y1="643" x2="600" y2="643" stroke="#C4683E" stroke-width="1" opacity="0.35"/>

  <!-- "da Pele" -->
  <text
    x="400" y="694"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="300"
    font-style="italic"
    letter-spacing="12"
    text-anchor="middle"
    fill="#C4683E"
    opacity="0.92">da Pele</text>

</svg>
